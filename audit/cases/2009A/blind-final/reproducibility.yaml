  input/data/<SOURCE_FILE_REDACTED>: "d012ec8a7130e8a265240941d27fb660fb84454e6ecc3ec436bab3d969d3cb05"
expected_checks:
  phase_lock: pass
  input_original_integrity: pass
  numerical_generation: pass
  controller_properties: pass
