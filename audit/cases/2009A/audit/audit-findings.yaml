      扭矩不低于 40 N·m，所以现有回放没有触发此错误，但控制器边界条件不完整。
    recommended_fix: >-
      对 abs(M_hat) 大于明确阈值时严格使用 |u|<=30*|M_hat|/J_e；低扭矩区切换到独立的绝对扭矩、
