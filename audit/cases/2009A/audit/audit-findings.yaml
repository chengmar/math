    category: numerical_stability_and_robustness
    evidence: >-
      Q6 在 solve.py 第 193--197 行使用 -J_m*e/h 的一步死拍校正。h=0.01 s、M_hat=100 N·m 时，
      仅 -0.09663 rpm 的速度测量误差即可触发正向 ±30 kg·m² 饱和，+0.24442 rpm 可触发反向饱和。
      对附表做 100 个固定种子的速度噪声压力测试：sigma=0.1 rpm 时中位数 25 个区间限幅、峰值电流
      中位数 270.12 A；sigma=0.5 rpm 时中位数 250 个区间限幅。若实际机械惯量 J_a 与设计 J_d 不同，
      线性误差极点为 1-J_d/J_a；gamma=1 时只有 J_a>17.5 kg·m² 才渐近稳定。J_a=0.5 J_d 的
      数据回放 466 个区间全限幅，J_a=0.1 J_d 时能量误差 129.69%、最大速度误差 1015 rpm。
      40/300 N·m 每 10 ms 交替的非负扭矩反例中，Q6 有 49 次限幅、峰值 227.5 A，误差反而高于 Q5。
    affected_files:
      - frozen-solution/code/solve.py
      - frozen-solution/paper/sections/05-solution-validation.tex
      - frozen-solution/paper/sections/06-evaluation-conclusion.tex
      - frozen-solution/results/<SOURCE_FILE_REDACTED>
    reason: >-
      “稳健性”结论只覆盖 5--50 ms、机械惯量 ±5% 和扭矩比例偏差，没有测试最敏感的速度噪声、
      快速扭矩变化或稳定域。反馈增益随 1/h 增大，会把很小的速度误差转化为大电流；题面未给硬件边界，
      因而物理可行性仍需人工确认。
    recommended_fix: >-
      推导并声明 J_a、gamma、h 的稳定域；对速度观测加滤波/观测器并按噪声带宽选择 gamma；加入绝对
      电流、扭矩、变化率、抗饱和和故障降级。增加速度量化/噪声、扭矩阶跃/跌落、宽惯量区间和多轨迹验证。
    requires_human_review: true

