attribution_summary:
  independently_present_before_audit:
    - "Q1–Q4 物理主线与数据积分。"
    - "电机关闭、速度差分、扭矩 ZOH 基线。"
    - "预测加速度误差反馈的 Q6 原型。"
    - "model-in-the-loop 与硬件边界声明。"
  corrected_after_audit:
    - "原始 XLS 隔离与唯一生成链。"
    - "分段精确乘积积分。"
    - "低扭矩、绝对扭矩、变化率与停止约束。"
    - "minmod 预测、观测器、固定反馈和声明稳定域。"
    - "噪声、快速交替、宽惯量与停止压力测试。"
  learned_after_reading_references:
    - "用显式时移算子表达一拍滞后。"
    - "用阶数—误差—运行时表呈现预测补偿的计算预算。"
    - "用多类扭矩生成场景做系统化仿真，但必须固定种子并与拟合轨迹隔离。"
    - "把反馈系数扫描作为调参证据，而不是只报一个参数。"
