schema_version: 1
case_id: "2009A"
phase: solve
status: pass
seed: 2009
randomness_note: "The main algorithm is deterministic and uses no random draws; the seed is fixed for reproducibility policy compliance."
workspace_assumption: "Run from the current minimal solve workspace; do not point the command at another phase or vault."
primary_command: >-
  powershell -NoProfile -ExecutionPolicy Bypass -File code/run_all.ps1
  -Workspace <RUNTIME_ROOT>\2009A\workspaces\solve -VerifyPaper
pipeline:
  - order: 1
    action: "<SOURCE_FILE_REDACTED> input through Excel COM in read-only mode."
    script: code/extract_data.ps1
    outputs: [results/<SOURCE_FILE_REDACTED>, results/input-metadata.json]
  - order: 2
    action: "Compute all question results, controller replays, sensitivity tables, figures, and TeX macros."
    script: code/solve.py
    outputs:
      - results/metrics.json
      - results/<SOURCE_FILE_REDACTED>
      - results/<SOURCE_FILE_REDACTED>
      - results/<SOURCE_FILE_REDACTED>
      - results/<SOURCE_FILE_REDACTED>
      - results/summary.md
      - figures/<SOURCE_FILE_REDACTED>
      - figures/<SOURCE_FILE_REDACTED>
      - figures/<SOURCE_FILE_REDACTED>
      - figures/<SOURCE_FILE_REDACTED>
      - paper/generated-results.tex
  - order: 3
    action: "Compile paper/main.tex twice with XeLaTeX."
    script: code/run_all.ps1
    outputs: [paper/<SOURCE_FILE_REDACTED>]
  - order: 4
    action: "Independently recompute key quantities and check paper-result consistency."
    script: code/verify.py
    outputs: [results/verification.json]
