evidence:
  - "冻结修订修复单应方向、齐次归一化和像素/米单位。"
  - "R1/R3 的像素比例不足以在一般透视下建立地面度量。"
promotion_requirements:
  - "在公开原视频与已知控制几何上由独立实现复现。"
  - "覆盖相机移动、控制点退化和地面非平面反例。"
