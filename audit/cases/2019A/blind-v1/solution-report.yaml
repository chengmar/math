limitations:
- 集总压力模型忽略管内压力波和沿程损失。
- 阀芯动力学、开闭延迟、最小驻留时间和驱动功率未给定。
- 1200 rpm高稳压方案要求充分补油和约0.5 kHz级减压阀带宽。
- 喷嘴瓶颈面积与串联阻力模型使问题2角速度相差约16.3%。
- 高稳压方案回流量约为喷油量的1.30倍，能耗明显。
failure_conditions:
- 压力超出附件3的0至200 MPa范围。
- 柱塞腔在下行阶段不能恢复至0.5 MPa并充分充满。
- 减压阀实际响应时间或最小驻留时间无法实现计算回差控制。
- 真实喷嘴的两处局部损失不能由瓶颈面积近似。
