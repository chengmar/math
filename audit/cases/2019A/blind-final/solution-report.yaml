limitations:
  - 集总压力模型忽略压力波、管壁弹性、温度与沿程损失。
  - 喷嘴两处局部损失不可由现有数据唯一辨识，角速度只能给结构区间。
  - 减压阀延迟、驻留和切换能力无设备数据，控制方案只能条件化。
  - 高转速下柱塞腔充分补油尚无外部验证。
failure_conditions:
  - 压力离开附件3的0至200 MPa范围。
  - 柱塞腔不能在下行阶段恢复至0.5 MPa并充分充满。
  - 实际减压阀不能满足所选情景的延迟、驻留或切换上限。
  - 真实喷嘴损失不落在两个结构端点所覆盖的范围内。
