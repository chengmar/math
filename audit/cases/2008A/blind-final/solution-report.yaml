questions:
  - id: Q1
    requirement: 建立数学模型和算法，确定靶标圆心在相机像平面的像坐标。
    status: pass
    method: 五个等半径圆的亚像素边界共享平面单应；主模型进一步约束为已知焦距的6参数相机位姿。
    evidence:
      - code/solve.py
      - results/<SOURCE_FILE_REDACTED>
      - paper/paper.md
  - id: Q2
    requirement: 对题图计算A、B、C、D、E五个圆心像坐标。
    status: pass
    result_file: results/<SOURCE_FILE_REDACTED>
    raw_pixel_centers:
      A: [321.997, 188.737]
      B: [422.287, 196.190]
      C: [639.517, 212.335]
      D: [582.146, 502.460]
      E: [283.656, 501.360]
    coordinate_convention: u向右、v向下；光心平行坐标x=u-512、y=384-v、z=1577 px。
  - id: Q3
    requirement: 设计检验方法并讨论精度、稳定性。
    status: pass
    methods:
      - 整圆留一外部预测
      - 五档分割阈值敏感性
      - 固定种子100次轮廓扰动
      - 正深度、旋转正交和标号分离检查
      - 全黑、全白、四目标、越界阈值和共线控制点拒绝测试
    evidence:
      - results/validation.json
      - results/sensitivity.json
      - results/extreme_checks.json
      - figures/<SOURCE_FILE_REDACTED>
      - figures/<SOURCE_FILE_REDACTED>
  - id: Q4
    requirement: 建立用该靶标给出两部固定相机相对位置的数学模型和方法。
    status: pass
    method: 分别分解两相机靶标单应得到R_j和t_j，再用R_21=R_2 R_1^T、t_21=t_2-R_21 t_1消去靶标坐标。
    numerical_two_camera_example: needs_review
    reason: 当前附件未提供第二相机同步图像；未伪造数值相对位姿。
