limitations:
  - 题面未给主点，主点取图像中心；真实主点偏差会影响相机坐标和位姿。
  - 未给镜头畸变参数；广角或强畸变图像需先反畸变。
  - JPEG压缩和抗锯齿限制边界精度；单点精度宜按留一圆最差约1.1 px理解。
  - 遮挡、粘连、靶标翘曲、掠射视角或少于四个有效目标会导致失效。
  - 双相机数值外参需要第二相机同步图像和内参。
