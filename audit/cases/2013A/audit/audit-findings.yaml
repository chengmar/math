    recommended_fix: >-
      Generate one authoritative retrieval/source ledger at freeze time, embed the exact copied-card hashes,
      commands, seed and dependencies in the manifest, cross-check all derivative reports against it, and have
      a human verify the solve-session access log before upgrading leakage provenance to pass.
    requires_human_review: true

  - id: AUD-009
    severity: minor
    category: unit_consistency
    evidence: >-
      variables.yaml defines delta_t in hours and paper/paper.md correctly uses sum(a_r*n_jr)/delta_t, but
      model-selection.md writes C_j=3600*sum(a_r*n_jr)/delta_t. If delta_t is one hour-unit window, this adds
      an erroneous factor of 3600; the formula is correct only if delta_t is explicitly measured in seconds.
    affected_files:
      - frozen-solution/variables.yaml
      - frozen-solution/model-selection.md
      - frozen-solution/paper/paper.md
    reason: >-
      The same symbol has incompatible unit conventions across frozen artifacts, creating a 3600-fold failure
      mode when the proposed Question 1 estimator is implemented.
    recommended_fix: >-
      Choose one convention globally: remove 3600 when delta_t is in hours, or redefine and rename it as
      delta_t_seconds and retain 3600. Add a 60 PCU in 60 s unit test expecting 3600 pcu/h.
    requires_human_review: false

  - id: AUD-010
    severity: minor
    category: numerical_stability
    evidence: >-
      Get-KinematicResult rounds growth speed to six decimals before Get-QueueLengthM consumes it. At q=1500
      and C=1499.9999 pcu/h, the raw growth is 3.5398229e-7 km/h and the finite hitting time is
      23730000.56 min, but the returned speed rounds to 0 and downstream length calculations report no growth.
    affected_files:
      - frozen-solution/code/solve.ps1
    reason: >-
      Premature rounding creates internally inconsistent state near the documented singular boundary C->q-.
      The supplied main range 800-1200 is unaffected, but extreme/counterexample behavior is not stable.
    recommended_fix: >-
      Retain full-precision internal values, round only serialized/display fields, use scientific notation near
      zero, and add condition-number or near-threshold warnings and regression tests.
    requires_human_review: false

