    judgment: fail
    evidence: |-
      phase-lock 与 allowed/forbidden 控制文件哈希均为 pass，results/run_manifest.json 的 27 条记录也逐条通过路径、存在性、字节数（求解器未声明字节数）和 SHA-256 核验。
      但冻结目录没有覆盖完整解答树的独立 FROZEN 清单：审计观察到 176 个文件，现有运行清单只覆盖 27 个，149 个未覆盖；未覆盖项包括论文、转换/一致性/复现脚本和解答说明。
      frozen-solution/reproducibility.yaml:81 记录 paper/<SOURCE_FILE_REDACTED> 的 SHA-256 为 50603caecb09eb7bb23a3a9442114717ca8d0ba409f981135e14edc5ea1a7ca2；对当前 901123 字节文件连续两次重算均为 fe8ef5b1503844399b8619723b4b47801523d51818d23d5e5030033524dc7bbc，record_match=fail。
      frozen-solution/solution-report.yaml:11 仍写 frozen: false。
