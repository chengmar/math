      frozen-solution/paper/paper.md 含 18 个异常 C0 控制字符：1 个退格、13 个制表符、4 个换页符，影响 11 行。paper.md:112、130--131、153、167 等处的 frac、tau、begin、times、text、to 被破坏。
      frozen-solution/results/consistency_check.json 仍把 markdown_key_numbers 判为 pass，因为检查器只搜索少量数字片段，没有校验公式或控制字符。
    affected_files:
      - "frozen-solution/paper/paper.md"
      - "frozen-solution/code/check_consistency.py"
