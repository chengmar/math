  - id: "AUD-009"
    severity: minor
    category: "reported_metric_definition"
    judgment: fail
    evidence: |-
      frozen-solution/code/solve_population.py:599-603 用各地区育龄女性总量加权地区出生性别比，写入 trajectory 的 birth_sex_ratio；真实全国出生性别比应按各地区实际男婴/女婴数汇总，权重取决于地区生育率和年龄结构。
      2005 年代码报告 118.267806，按模型实际出生数汇总为 118.761878，相差 -0.494072；2010 年相差 -0.435844。到 2020 年各地区都被设为 107 后差异消失。状态递推中的分地区性别分配本身正确，错误只在汇总指标。
    affected_files:
      - "frozen-solution/code/solve_population.py"
      - "frozen-solution/results/<SOURCE_FILE_REDACTED>"
    reason: "结果列名称暗示实际全国出生人口性别比，但计算的是另一种女性人口加权平均。"
    recommended_fix: "用 sum_r male_births_r / sum_r female_births_r * 100 汇总并输出；若保留旧指标，应改名并说明定义。"
    requires_human_review: false
