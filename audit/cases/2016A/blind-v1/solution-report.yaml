limitations:
  - 准静力二维模型不覆盖波浪、瞬态、疲劳和三维扭转。
  - 题面未给链环线径和重物球直径，未显式计算链与球流阻。
  - 重物球干质量依赖钢质假设；通用设计量是水下有效重量。
  - 只执行题给 16 度判据，未证明锚土真实承载力。
  - Q3 最小名义干舷约 0.187 m；若有浮力储备规范须重新优化。
