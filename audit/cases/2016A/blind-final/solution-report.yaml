limitations:
  - 球真实排水体积、水动力直径和阻力作用点缺失，范围外结构须重算。
  - 题面未给链环迎流面积，未显式计算链流阻。
  - 准静力二维模型不覆盖波浪、冲击、涡激、疲劳与三维扭转。
  - 只执行题给 16 度判据，不证明锚土真实承载力。
  - 10% 压力下最小干舷约 0.107 m；若规范要求更大储备须重新优化。
