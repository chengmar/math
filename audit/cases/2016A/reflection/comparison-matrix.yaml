    R1: "主要为结果展示；随机收敛证据缺失"
    R2: "换取矩点推导；无残差与容差"
    R3: "步长缩小和灵敏度；无独立实现"
    R4: "双锚链表达对照和步长灵敏度；无预设容差"
  complexity:
    B: "解析单次模型中等；完整确定性搜索较高；约 88443 次筛选"
    R1: "种群×代数×模型调用；实际运行量 needs_review"
    R2: "约 210 链环递推×搜索；实际运行量 needs_review"
    R3: "三维逐链环×粗细搜索；实际运行量 needs_review"
    R4: "连续悬链线×枚举；实际运行量 needs_review"
