    B: high
    R1: medium_high
    R2: medium
    R3: medium
    R4: high
  expression:
    B: "条件结论、状态词和证据追溯清楚；编译 PDF 页检 needs_review"
    R1: "主线清楚；摘要/正文数字冲突；GA 通用说明过长"
    R2: "表格清楚；摘要误放游动半径；验证缺少误差"
