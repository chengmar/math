limitations:
  - 单期表层土数据没有时间箭头，不能确认传播方向、速度和因果顺序。
  - 背景原始样本、样本数和空间位置缺失，背景外部有效性待核。
  - 缺少风雨、径流、排水、排放、交通、土壤性质、深度和源端指纹。
  - Gaussian 核可能平滑边界与紧邻点源，统一带宽对 Cr、Zn 非逐元素最优。
  - NMF 分量和核峰不是唯一真实源谱或排放点。
