  - id: AUD-010
    status: needs_review
    severity: suggestion
    category: validation_scope
    evidence:
      - >-
        3 km 网格同块同折检查为 pass，4 对 <0.1 km 近邻均未拆分；但随机平衡后的折在空间上
        交错，319 个验证点中 119 个距离最近训练点 <1 km，最小距离 0.164 km，中位 1.081 km。
      - >-
        200 个替代随机块划分中 Gaussian 200/200 次获胜；连续 KMeans 5 区留出中 Gaussian
        仍获胜，但内层带宽多选 3-4 km，而最终全数据为 2 km。
    affected_files:
      - frozen-solution/code/solve.py
      - frozen-solution/results/<SOURCE_FILE_REDACTED>
      - frozen-solution/results/<SOURCE_FILE_REDACTED>
      - frozen-solution/paper/main.tex
    reason: >-
      当前验证适合评价网格内局部插值，但“无泄漏”容易被误读为带空间缓冲的区域外推；
      模型家族选择稳健，精确带宽和外推误差的适用范围仍需限定。
    recommended_fix: >-
      在现有 block CV 外增加 buffer CV 或连续区域留出，报告验证点到训练集的距离分层误差；
      将结论明确限定为采样域内插值，并避免把 2 km 带宽解释为物理尺度。
    requires_human_review: true
