limitations:
  - Profit margin values and fixed/overhead costs are absent, so absolute profit cannot be estimated.
  - The concavity parameter is an engineering judgment; the descriptive elasticity is non-causal and near zero.
  - The questionnaire-augmented forecast improves holdout WAPE only modestly over the trend rule.
  - Course-level allocation is advisory; qualitative editorial review remains necessary, especially for five zero-new-ISBN courses.
  - HR sharing, overtime and outsourcing are not observed.
