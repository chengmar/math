data_quality:
  status: needs_review
  issues:
    - four 2006 branch total cells are hardcoded and disagree with detailed course sums
    - mathematics historical allocations exceed the nominal HR bottleneck in all five years
    - only numeric Q2a rows can be mapped safely to the 72 target courses
  evidence: results/data_audit.json

limitations:
  - Profit margin values and fixed/overhead costs are absent, so absolute profit cannot be estimated.
  - The concavity parameter is an engineering judgment; the descriptive elasticity is non-causal and near zero.
  - The questionnaire-augmented forecast improves holdout WAPE only modestly over the trend rule.
  - Course-level allocation is advisory; qualitative editorial review remains necessary, especially for five zero-new-ISBN courses.
  - HR sharing, overtime and outsourcing are not observed.
  - The original independent audit did not reach mathematical or model review.
  - Office COM reconversion remains needs_review after an RPC cleanup failure; retained conversions passed structural and byte-hash checks.

