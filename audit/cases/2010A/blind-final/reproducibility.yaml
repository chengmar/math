schema_version: 2
phase: blind-revision
status: needs_review
random_seed: 20260824
workspace_assumption: 从当前 blind-revision 工作区运行
environment:
  os: Windows
  powershell:
    version_requirement: '>=7'
    verified_version: 7.6.4
    status: pass
  python: 3.12.13
  numpy: 2.5.2
  pandas: 3.0.5
  scipy: 1.18.0
  matplotlib: 3.11.1
  pyyaml: 6.0.3
  spreadsheet_reader: Microsoft Excel COM 12.0
  tex_engine: XeLaTeX (MiKTeX portable)
  lock_file: requirements-lock.txt
  hermetic_offline_environment:
    status: needs_review
    note: 精确版本已锁定并在本机验证，但未随工作区提供离线 wheel 包。
commands:
  full_pipeline: pwsh -NoProfile -File code/run_all.ps1
  without_pdf: pwsh -NoProfile -File code/run_all.ps1 -SkipPdf
  manifest_recheck: python code/build_manifest.py --verify
pipeline_order:
  - 清空并验证仅限当前工作区的 results/ 与 figures/
  - 从原始 XLS 的工作副本导出 CSV
  - 生成模型、结果和仅被论文引用的图
  - 从结构化结果渲染 Markdown 与 LaTeX 表
  - 可选地从零编译 PDF，并删除编译临时文件
  - 运行不导入生产 model.py 的自适应积分验证
  - 核对结构、状态词汇、论文数字和 blind-v1 树哈希
  - 最后生成并复核单一 run_manifest.json
determinism:
  generated_core_two_clean_runs:
    status: pass
