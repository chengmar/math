  validation:
    blind: "Time-block roles, independent adaptive quadrature, boundary invariants, HAC, cumulative-state cross-check, multistart, and engineering stress scenarios."
    reference_set: "Mostly in-sample relative errors, fit coefficients, or tautological upright-display checks."
    assessment: "Reference claims remain needs_review."
  complexity:
    blind: "O(iter * Nobs * Nx) with one clipped integrand and few branches."
    R1: "Sequential angle scans reduce cost but do not solve the joint objective."
    R2: "Two-dimensional grid plus numerical integration and empirical correction."
    R3: "Eight geometric cases create high derivation and implementation complexity."
    R4: "O(Galpha * Gbeta * GV0 * Nobs); scanning the separable nuisance V0 is redundant."
  interpretability:
    blind: "Conditional parameters, beta-sign ambiguity, model envelopes, and non-confidence stress ranges are explicit."
    reference_set: "Geometric diagrams are strong; empirical corrections and approximation error are less interpretable."
  expression:
    blind: "Data roles and precision policy are explicit."
    reference_set: "R1/R4 are compact; R2/R3 are appendix-heavy, and R3 does not foreground final parameters."
