dimensions:
  decomposition:
    blind: "Unified cross-section, plane-cut integration, mass balance, identification, table, and validation chain."
    reference_set: "Mostly problem-specific piecewise derivations; R3 uses eight actual-tank cases."
    assessment: "Blind is easier to test and maintain; explicit reference diagrams remain useful."
  assumptions:
    blind: "Conditional engineering assumptions are explicit and stress-tested."
    reference_set: "Mostly idealized assumptions; head approximations and measurement effects are weakly quantified."
    assessment: "Blind stronger, but real tolerances and the small-probe mechanism remain unresolved."
  data_roles:
    blind: "Selection, refit, time checks, refill, and old-display roles are separated."
    reference_set: "R4 correctly rejects the old display table for fitting; most validations reuse fitted data."
    assessment: "Blind stronger after audit correction."
  models:
    blind: "Clipped ellipse/circle segment functions integrated over an axial radius profile."
    reference_set: "Nominal small geometry; approximate or piecewise spherical-head treatment."
    assessment: "Reference geometry is intuitive but often less exact or more branch-heavy."
