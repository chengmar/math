notes:
  - The pipeline computes twice and records actual SHA-256 comparisons in results/consecutive-rerun.json.
  - PDF is built before the artifact manifest; results/manifest-verification.json verifies every declared current artifact afterward.
  - The current artifact manifest is not a freeze attestation. The external blind-final freeze procedure must issue truthful frozen metadata and a fresh package manifest.
  - Cross-platform byte identity is not claimed because fonts, Access providers, BLAS, and rendering stacks may differ.
  - XeLaTeX returned exit code 0 and the LaTeX log contained no matched warnings/errors, but MiKTeX reported that the host Windows version is unsupported and its update status was not checked; runtime support therefore remains needs_review.
