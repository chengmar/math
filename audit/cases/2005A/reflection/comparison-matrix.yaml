dimensions:
  problem_decomposition:
    B: "regulatory grading -> mass-balance source attribution -> constrained forecast -> safe-pressure capacity"
    R178: "continuous score -> three inverse models -> regression forecast -> regression capacity"
    R1BE: "custom index -> decay increment -> accumulated polynomial/time series -> regression LP"
    R622: "dynamic score -> interval source inversion -> regression/grey forecast -> hydrologic-period capacity"
    R869: "variable-weight TOPSIS/grey relation -> midpoint source -> GM+ARMA -> regression cap"
  assumptions:
    B:
      strengths: ["explicit equal station-month scope", "signed negative loads retained", "scenario language"]
      risks: ["uniform first-order decay", "10-year linear continuation", "safe pressure is not causal"]
    R178:
      strengths: ["reaction-advection-diffusion framing", "branch cases"]
      risks: ["rough spatial coverage", "empirical weights/distances", "deleted points"]
    R1BE:
      strengths: ["explicit decay coefficient", "explicit no-disaster scenario"]
      risks: ["negative increments clamped", "fixed evaluation length", "high-order extrapolation"]
    R622:
      strengths: ["source-location bounds", "dry/wet/hydrological-year strata"]
      risks: ["subjective dynamic weights", "small-sample regression and GM"]
    R869:
      strengths: ["midpoint source assumption stated", "steady one-dimensional model"]
      risks: ["subjective S-curve anchors", "GM/ARMA details omitted"]
  baselines:
    B: ["reported class", "concentration difference", "persistence", "expanding mean"]
    R178: []
    R1BE: ["time series used as a complement, not a clean baseline"]
    R622: ["method families discussed, no rolling numerical baseline"]
    R869: []
  validation:
    B:
      status: pass
      items: ["476/476 class reproduction", "mass-balance identity", "rolling-origin baselines", "bootstrap", "k sensitivity", "boundary checks"]
      external_validity: needs_review
    R178:
      status: needs_review
      items: ["F tests", "three-method triangulation", "two capacity methods compared"]
    R1BE:
      status: needs_review
      items: ["in-sample RMSE", "80 percent interval", "self-critique"]
    R622:
      status: needs_review
      items: ["physical bounds", "hydrologic-period scenarios", "post-hoc critique"]
    R869:
      status: needs_review
      items: ["no substantive validation section"]
  complexity:
    B: low_to_medium
    R178: medium_to_high
    R1BE: medium
    R622: medium
    R869: medium_to_high
  interpretability:
    B: high
    R178: medium
    R1BE: medium
    R622: high
    R869: medium

