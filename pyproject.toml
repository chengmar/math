[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cumcm-a-lab"
version = "0.1.0"
description = "CUMCM A 题能力训练实验室的本地隔离、冻结、审计与评测工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6,<7",
  "jsonschema>=4,<5",
]

[project.scripts]
cumcm-lab = "cumcm_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

